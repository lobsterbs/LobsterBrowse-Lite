name: build-r116
on:
  push:
    branches: [r116]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build r116 artifact from r115 base (builder gates + md5 byte gate + fail-set parse gate)
        run: |
          mkdir -p /tmp/lb
          cp LobsterBrowse-Lite-r115.html /tmp/lb/r115.html
          node builders/builder116.cjs
          GOT=$(md5sum /tmp/lb/r116.html | cut -d' ' -f1)
          echo "built md5=$GOT"
          test "$GOT" = "2d8fd8013df64c8c5001aa9bdf0f000a"
          cp /tmp/lb/r116.html LobsterBrowse-Lite-r116.html
      - name: Commit r116 artifact
        run: |
          git config user.name "lobsterbs"
          git config user.email "jeglikerikkeskole@hotmail.com"
          git add LobsterBrowse-Lite-r116.html
          git commit -m "r116 artifact: builder116 gates green incl every-block-parses, md5 2d8fd8013df64c8c5001aa9bdf0f000a [skip ci]"
          git push
