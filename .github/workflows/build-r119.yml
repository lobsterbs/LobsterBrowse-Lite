name: build-r119
on:
  push:
    branches: [r119]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build r119 artifact from r118 base (builder gates + md5 byte gate + fail-set parse gate + fu post-lane mock decision table)
        run: |
          mkdir -p /tmp/lb
          cp LobsterBrowse-Lite-r118.html /tmp/lb/r118.html
          node builders/builder119.cjs
          GOT=$(md5sum /tmp/lb/r119.html | cut -d' ' -f1)
          echo "built md5=$GOT"
          test "$GOT" = "24a84da11f0b780ca47660a988f72eec"
          cp /tmp/lb/r119.html LobsterBrowse-Lite-r119.html
      - name: Commit r119 artifact
        run: |
          git config user.name "lobsterbs"
          git config user.email "jeglikerikkeskole@hotmail.com"
          git add LobsterBrowse-Lite-r119.html
          git commit -m "r119 artifact: builder119 gates green incl fu post-lane mock, md5 24a84da11f0b780ca47660a988f72eec [skip ci]"
          git push
